name = "think-first-ai"
main = "index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Keep Worker logs in the Cloudflare dashboard (Workers → think-first-ai → Logs), so errors
# and 429s can be reviewed later, not only live with `wrangler tail`. The Worker's own log
# lines contain only error status codes, never chat messages or keys.
[observability]
enabled = true

[vars]
# Comma-separated list of allowed browser origins (an Origin header has no path).
# http://localhost:* is allowed only when ALLOW_LOCALHOST = "true", which belongs in
# worker/.dev.vars for local testing, never here.
ALLOWED_ORIGINS = "https://salhemamalik29-hub.github.io"

# Cloudflare's rate limiter: 20 requests per minute per IP, counted across Worker
# instances (the in-memory limiter in index.js is only the fallback).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# The API key is a secret, never stored here:
#   npx wrangler secret put ANTHROPIC_API_KEY
# For local `wrangler dev`, put it in worker/.dev.vars (gitignored).
