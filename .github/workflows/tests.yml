name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 26 runs every test file when `node --test` is given a directory.
          node-version: 26
      # No API key needed: the Worker tests use a mocked model.
      - run: node --test tests/
